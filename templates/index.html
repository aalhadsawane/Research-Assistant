<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAW - AI Research Helper</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/light.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.8/clipboard.min.js"></script>
    <style>
        .form-card {
            transform: translateY(-20px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }
        .form-card:hover {
            transform: translateY(-25px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .copy-btn {
            padding: 0.5rem;
            border-radius: 0.375rem;
            background-color: #f3f4f6;
            transition: all 0.2s ease;
        }
        .copy-btn:hover {
            background-color: #e5e7eb;
        }
        .copy-btn.copied {
            background-color: #34d399;
            color: white;
        }
        .info-icon {
            display: inline-flex;
            margin-left: 0.5rem;
            color: #6B7280;
            cursor: help;
            transition: all 0.2s ease;
        }
        .info-icon:hover {
            color: #3B82F6;
            transform: scale(1.1);
        }
        .tippy-box[data-theme~='custom'] {
            background-color: white;
            color: #1F2937;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 0.75rem;
            padding: 1.25rem;
            font-size: 1.125rem;
            line-height: 1.6;
            max-width: 450px !important;
            border: 1px solid #E5E7EB;
        }
        .tippy-box[data-theme~='custom'][data-placement^='top'] > .tippy-arrow::before {
            border-top-color: white;
        }
        .tippy-box[data-theme~='custom'] .tippy-content {
            padding: 0;
        }
        .search-query {
            background-color: #F3F4F6;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            font-family: monospace;
            font-size: 0.875rem;
            color: #374151;
        }
        /* Add styles for iteration header */
        .iteration-header {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1F2937;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .iteration-header::before {
            content: '›';
            color: #3B82F6;
            font-size: 1.5rem;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-12">ASAW - AI Research Helper</h1>
        
        <!-- Input Form -->
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8 mb-12 form-card">
            <div class="mb-6">
                <div class="flex items-center">
                    <label for="topic" class="block text-gray-700 font-semibold">Research Topic</label>
                    <div class="info-icon" data-tippy-content="Enter the topic or question you want to research. Be as specific or broad as you'd like - the AI will adapt its search strategy accordingly.">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
                <textarea id="topic" class="mt-2 w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg" rows="3" placeholder="Enter your research topic or problem"></textarea>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div>
                    <div class="flex items-center">
                        <label for="iterations" class="block text-gray-700 font-semibold">Maximum Iterations</label>
                        <div class="info-icon" data-tippy-content="Number of research cycles. Each iteration involves a new search query based on previous findings. More iterations mean more comprehensive research but take longer. The process stops if no results are found.">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                    </div>
                    <input type="number" id="iterations" class="mt-2 w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value="3" min="1" max="10">
                </div>
                <div>
                    <div class="flex items-center">
                        <label for="wordCount" class="block text-gray-700 font-semibold">Word Count</label>
                        <div class="info-icon" data-tippy-content="Target length for the final summary. The AI will aim to create a summary of approximately this length while maintaining coherence and covering all key points.">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                    </div>
                    <input type="number" id="wordCount" class="mt-2 w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value="300" min="100" max="1000">
                </div>
                <div>
                    <div class="flex items-center">
                        <label for="temperature" class="block text-gray-700 font-semibold">Temperature</label>
                        <div class="info-icon" data-tippy-content="Controls the creativity of the AI. Lower values (0.1-0.3) produce more focused, consistent results. Higher values (0.7-1.0) produce more creative and varied results. Start with 0.3 for factual research.">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                    </div>
                    <input type="number" id="temperature" class="mt-2 w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value="0.3" min="0" max="1" step="0.1">
                </div>
            </div>
            <button onclick="submitResearch()" class="w-full bg-blue-500 text-white font-semibold py-3 px-6 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg transition-colors duration-200">
                Start Research
            </button>
        </div>

        <!-- Progress Section -->
        <div id="progress" class="hidden max-w-2xl mx-auto mb-8">
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="mb-4">
                    <div class="w-full bg-gray-200 rounded-full h-4">
                        <div id="progressBar" class="bg-blue-500 h-4 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
                <p id="progressMessage" class="text-gray-600 text-center"></p>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results" class="hidden max-w-4xl mx-auto">
            <div class="bg-white rounded-lg shadow-md p-6 mb-6 relative">
                <div class="flex items-center mb-4">
                    <h2 class="text-2xl font-bold">Final Summary</h2>
                    <button class="copy-btn ml-auto" onclick="copyToClipboard('finalSummary')">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                        </svg>
                    </button>
                </div>
                <div id="finalSummary" class="text-gray-700 prose max-w-none"></div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <h2 class="text-2xl font-bold mb-4">Iteration Summaries</h2>
                <div id="iterationSummaries" class="space-y-6"></div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold mb-4">All Sources</h2>
                <div id="sources" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        // Initialize tooltips with larger size
        tippy('.info-icon', {
            theme: 'custom',
            placement: 'right',
            arrow: true,
            animation: 'scale',
            duration: [200, 150],
            interactive: true,
            maxWidth: 400
        });

        // Initialize ClipboardJS
        new ClipboardJS('.copy-btn', {
            text: function(trigger) {
                const targetId = trigger.getAttribute('onclick').match(/'([^']+)'/)[1];
                return document.getElementById(targetId).innerText;
            }
        }).on('success', function(e) {
            const btn = e.trigger;
            btn.classList.add('copied');
            setTimeout(() => btn.classList.remove('copied'), 2000);
        });

        let eventSource = null;

        // Modify the marked renderer to handle headings appropriately
        const renderer = new marked.Renderer();
        renderer.heading = function(text, level) {
            // Ensure text is a string and handle potential objects
            let headingText = text;
            try {
                // If it's a parsed token object, extract the text content
                if (typeof text === 'object' && text !== null) {
                    if (text.tokens && text.tokens.length > 0) {
                        headingText = text.tokens.map(token => token.text || '').join(' ');
                    } else if (text.text) {
                        headingText = text.text;
                    }
                }
                
                // Convert to string if it's still not a string
                headingText = String(headingText);
                
                // Remove any markdown syntax that might have been left
                headingText = headingText.replace(/[#*[\]()]/g, '').trim();
                
                // If we still have [object Object], use a fallback
                if (headingText === '[object Object]') {
                    const fallbacks = {
                        1: 'Overview',
                        2: 'Key Findings',
                        3: 'Analysis',
                        4: 'Conclusion'
                    };
                    headingText = fallbacks[level] || 'Section';
                }
            } catch (e) {
                console.error('Error processing heading:', e);
                headingText = 'Section';
            }
            
            // Increase all heading levels by 1 to make them subordinate to the main heading
            const newLevel = Math.min(level + 1, 6);
            return `<h${newLevel} class="font-bold ${newLevel === 2 ? 'text-xl' : 'text-lg'} mt-4 mb-2">${headingText}</h${newLevel}>`;
        };

        // Set additional marked options for better rendering
        marked.setOptions({
            renderer: renderer,
            headerIds: false,
            mangle: false,
            breaks: true,
            gfm: true
        });

        function submitResearch() {
            const topic = document.getElementById('topic').value;
            const iterations = document.getElementById('iterations').value;
            const wordCount = document.getElementById('wordCount').value;
            const temperature = document.getElementById('temperature').value;
            
            if (!topic) {
                alert('Please enter a research topic');
                return;
            }

            // Show progress, hide results
            document.getElementById('progress').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('progressBar').style.width = '0%';

            // Close existing EventSource if any
            if (eventSource) {
                eventSource.close();
            }

            // First make POST request
            fetch('/research', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    topic,
                    iterations,
                    wordCount,
                    temperature
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.session_id) {
                    // Create EventSource with session ID
                    eventSource = new EventSource(`/research-progress?session_id=${data.session_id}`);
                    
                    // Handle progress updates
                    eventSource.onmessage = function(event) {
                        const data = JSON.parse(event.data);
                        
                        // Update progress bar and message
                        document.getElementById('progressBar').style.width = `${data.progress}%`;
                        document.getElementById('progressMessage').textContent = data.message;

                        if (data.status === 'complete') {
                            // Close EventSource
                            eventSource.close();
                            
                            // Display results
                            displayResults(data.data);
                        } else if (data.status === 'error') {
                            // Handle error
                            alert(data.message);
                            eventSource.close();
                        }
                    };

                    eventSource.onerror = function(error) {
                        console.error('EventSource failed:', error);
                        eventSource.close();
                    };
                }
            })
            .catch(error => {
                console.error('Error starting research:', error);
                alert('Error starting research. Please try again.');
            });
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector(`[onclick="copyToClipboard('${elementId}')"]`);
                btn.classList.add('copied');
                setTimeout(() => btn.classList.remove('copied'), 2000);
            });
        }

        function displayResults(data) {
            // Display final summary with markdown rendering
            document.getElementById('finalSummary').innerHTML = marked.parse(data.summary);

            // Display iteration summaries with their sources and search queries
            const iterationSummariesDiv = document.getElementById('iterationSummaries');
            iterationSummariesDiv.innerHTML = data.iteration_summaries.map((summary, index) => `
                <div class="border-l-4 border-blue-500 pl-4 relative">
                    <div class="flex items-center mb-4">
                        <h3 class="text-xl font-bold">› Iteration ${index + 1}</h3>
                        <button class="copy-btn ml-auto" onclick="copyToClipboard('summary-${index}')">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="search-query mb-4">
                        <span class="text-gray-500">Search Query:</span> ${data.queries ? data.queries[index] : 'Query not available'}
                    </div>
                    <div id="summary-${index}" class="text-gray-700 prose">${marked.parse(summary)}</div>
                    <div class="mt-4">
                        <h4 class="font-semibold text-sm text-gray-600">Sources for this iteration:</h4>
                        <ul class="list-disc pl-5 text-sm text-gray-600">
                            ${data.iteration_sources[index].map(source => `
                                <li><a href="${source.url}" target="_blank" class="text-blue-500 hover:underline">${source.title}</a></li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `).join('');

            // Display all sources
            const sourcesDiv = document.getElementById('sources');
            sourcesDiv.innerHTML = data.sources.map(source => `
                <div class="border-b border-gray-200 pb-2">
                    <a href="${source.url}" target="_blank" class="text-blue-500 hover:underline">
                        ${source.title}
                    </a>
                </div>
            `).join('');

            // Show results section
            document.getElementById('results').classList.remove('hidden');
        }
    </script>
</body>
</html>
